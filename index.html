<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桂黄瑞 AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23f5b042'/%3E%3Ctext x='50' y='66' font-size='46' text-anchor='middle' fill='%23fff'%3E瑞%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6f7; --panel:#fff; --bubble-me:#95ec69; --bubble-other:#fff;
  --text:#1c1c1c; --sub:#8a8a8a; --line:#e5e5e5; --accent:#07c160; --warn:#e64340;
  --header:#ededed;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;
  overflow:hidden;
}
/* ===== 顶栏 ===== */
header{
  background:var(--header);padding:10px 12px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--line);flex:0 0 auto;min-height:56px;
}
.avatar{
  width:42px;height:42px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(135deg,#f6b93b,#e58e26);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;user-select:none;
}
.title-block{flex:1;min-width:0}
.title-block .name{font-size:16px;font-weight:600;line-height:1.2}
.title-block .status{font-size:12px;color:var(--sub);line-height:1.4}
.header-btn{
  border:none;background:transparent;color:#576b95;font-size:14px;cursor:pointer;
  padding:6px 4px;flex:0 0 auto;min-height:44px;min-width:44px;
}
.header-btn:active{opacity:.6}
/* ===== 聊天区 ===== */
#chat{flex:1 1 auto;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.msg{display:flex;margin:6px 0;gap:8px;max-width:100%}
.msg .mini-av{
  width:36px;height:36px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(135deg,#f6b93b,#e58e26);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;
}
.msg.me{flex-direction:row-reverse}
.msg.me .mini-av{background:linear-gradient(135deg,#43a047,#2e7d32)}
.bubble{
  max-width:72%;padding:9px 12px;border-radius:8px;font-size:15px;line-height:1.55;
  word-break:break-word;white-space:pre-wrap;min-width:0;
  box-shadow:0 1px 1px rgba(0,0,0,.05);
}
.msg.other .bubble{background:var(--bubble-other);border-top-left-radius:2px}
.msg.me .bubble{background:var(--bubble-me);border-top-right-radius:2px}
.bubble.typing::after{content:"…";animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.time-tip{text-align:center;font-size:11px;color:var(--sub);margin:10px 0 2px}
/* 表情包大图（emoji 渲染） */
.emoji-big{font-size:42px;line-height:1.3;display:inline-block}
/* ===== 表情面板 ===== */
#emojiPanel{
  display:none;background:var(--panel);border-top:1px solid var(--line);
  padding:10px 12px;flex-wrap:wrap;gap:6px;flex:0 0 auto;max-height:40vh;overflow-y:auto;
}
#emojiPanel.show{display:flex}
.ep-item{
  border:1px solid var(--line);border-radius:8px;background:#fafafa;cursor:pointer;
  font-size:26px;padding:8px 10px;line-height:1;user-select:none;min-width:52px;text-align:center;
}
.ep-item:active{transform:scale(.9)}
.ep-item.text{font-size:14px;color:#576b95;padding:10px 12px}
/* ===== 输入栏 ===== */
.input-bar{
  background:var(--panel);border-top:1px solid var(--line);padding:8px 10px;
  display:flex;align-items:flex-end;gap:8px;flex:0 0 auto;
}
#input{
  flex:1;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:16px;
  outline:none;background:#fff;resize:none;max-height:96px;line-height:1.4;min-height:40px;
  font-family:inherit;
}
#input:focus{border-color:var(--accent)}
#sendBtn{
  border:none;background:var(--accent);color:#fff;border-radius:6px;padding:10px 18px;
  font-size:16px;cursor:pointer;flex:0 0 auto;min-height:44px;
}
#sendBtn:disabled{background:#b8e6cc}
#emojiBtn{
  border:none;background:transparent;font-size:24px;cursor:pointer;flex:0 0 auto;
  min-height:44px;min-width:44px;padding:0;
}
/* ===== 设置面板 ===== */
#settings{
  position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:50;
  align-items:flex-end;justify-content:center;
}
#settings.show{display:flex}
.sheet{
  background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px;
  max-height:82vh;overflow-y:auto;
}
.sheet h3{font-size:16px;margin-bottom:12px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.field input,.field select{
  width:100%;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:16px;outline:none;
}
.field .hint{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.4}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.toggle .t-label{font-size:14px}
.switch{width:44px;height:24px;border-radius:12px;background:#ccc;position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s}
.switch.on{background:var(--accent)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on::after{left:22px}
.row-actions{display:flex;gap:10px;margin-top:14px}
.btn{
  flex:1;border:none;border-radius:6px;padding:12px;font-size:15px;cursor:pointer;
  min-height:44px;
}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:#f2f2f2;color:#333}
.btn.danger{background:#fff;color:var(--warn);border:1px solid #f0c0c0}
/* 人设卡片 */
.persona-card{
  background:#fffbe8;border:1px solid #f2e3b3;border-radius:8px;padding:10px;margin-bottom:14px;
  font-size:13px;line-height:1.6;color:#5a4a1a;
}
/* toast */
#toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.75);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;
  display:none;z-index:100;max-width:80%;text-align:center;
}
#toast.show{display:block}
/* 欢迎空态 */
#welcome{
  text-align:center;color:var(--sub);font-size:14px;padding:60px 20px;line-height:1.8;display:none;
}
#welcome.show{display:block}
#welcome .av{font-size:56px;margin-bottom:10px}
</style>
</head>
<body>

<header>
  <div class="avatar">瑞</div>
  <div class="title-block">
    <div class="name">桂黄瑞</div>
    <div class="status" id="statusText">未配置 API Key · 点击右上角设置</div>
  </div>
  <button class="header-btn" onclick="openSettings()">设置</button>
</header>

<div id="chat">
  <div id="welcome">
    <div class="av">🐑</div>
    现在你是桂黄瑞的 AI 分身。<br>说话风格：极简短句、带表情、爱发"？"、熟了会叫你土豆。<br>先在右上角「设置」里粘贴你的火山方舟 API Key 就能开聊。
  </div>
</div>

<div id="emojiPanel"></div>

<div class="input-bar">
  <button id="emojiBtn" onclick="toggleEmoji()" title="表情">😀</button>
  <textarea id="input" placeholder="发消息给 桂黄瑞…" rows="1"></textarea>
  <button id="sendBtn" onclick="send()">发送</button>
</div>

<div id="settings">
  <div class="sheet">
    <h3>设置</h3>
    <div class="persona-card" id="personaIntro"></div>
    <div class="field">
      <label>火山方舟 API Key</label>
      <input id="keyInput" type="password" placeholder="ark-xxxx" autocomplete="off">
      <div class="hint">Key 只保存在你的浏览器本地，不会上传到任何服务器。</div>
    </div>
    <div class="field">
      <label>模型</label>
      <select id="modelSelect"></select>
      <div class="hint" id="customModelWrap" style="display:none;margin-top:6px">
        <input id="customModel" type="text" placeholder="自定义模型 ID，如 doubao-seed-2-1-pro">
      </div>
    </div>
    <div class="toggle">
      <span class="t-label">人设模式（AI 以桂黄瑞风格回答）</span>
      <div class="switch on" id="personaSwitch" onclick="togglePersona()"></div>
    </div>
    <div class="row-actions">
      <button class="btn primary" onclick="saveSettings()">保存</button>
      <button class="btn ghost" onclick="clearChat()">清空聊天</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================= 人设 ================= */
const PERSONA_SYSTEM = [
'你现在是「桂黄瑞」（QQ 昵称：小狗染毛日记💛 / 蕈兽 / 超高校级の睡觉家🍃），一个真实存在的人，正在用 QQ 和多年好友「黄清华」（你常叫他"土豆"）聊天。你们 2022 年就认识，关系极熟：互相起外号、互怼、分享游戏与日常，可以开玩笑但不冒犯。',
'',
'【说话风格——必须严格遵守】',
'1. 极简短句：一条消息通常不超过 15 个字，只说一件事，能一个字说清绝不多说（"嗯""哦""靠""笑死"）。可以像 QQ 一样连发 2-3 条短消息。',
'2. 高频语气词：嗯、哦、嗷、嘛、吧、诶、呀、啊。',
'3. 招牌习惯：爱用"？""？？？"表达疑问或震惊；爱感叹（"妈呀""真的""我去""不是""啥"）；无语时用"。。。"。',
'4. 表情习惯：经常带 emoji——😭（无奈哭）、👀（盯/好奇）、👊（捶拳）、🤔（思考）、👍、🐑、🍃；情绪激动用"啊啊啊啊"。',
'5. 话题：游戏（王者荣耀、原神等，会用"小保底""周本""星耀""中单""承伤"这类黑话）、学习、日常吐槽、约着玩。',
'6. 态度：对好友很熟络，会怼、会笑、会安慰，但始终像真实朋友一样自然，不端不装。',
'',
'【示例对话】',
'土豆：在吗',
'你：嗯',
'土豆：你干啥呢',
'你：刚打完一把，中单被揍爆了',
'土豆：哈哈哈哈',
'你：笑死',
'你：我去 这局赢不了',
'你：（捶拳）👊',
'土豆：出来玩不',
'你：？？',
'你：大晚上的',
'你：不想动',
'',
'【铁律】',
'- 永远保持极简短句，禁止长篇大论、禁止总结陈词、禁止说"作为AI""作为分身"之类的话。',
'- 你就是桂黄瑞本人，用第一人称，别跳出人设。'
].join("\n");

const PERSONA_INTRO = "人设来源：你提供的 QQ 聊天记录（2022-2026，8640 条对方消息）。特征：极简短句（平均 6.7 字）、口头禅「真的/笑死/我去/妈呀/不是/啥」、表情三件套 😭👀👊、爱发「？」，游戏日常（王者/原神）党。";

/* ================= 表情 ================= */
const EMOJIS = ["😭","👀","👊","🤔","👍","🐑","🍃","🉑","💩","🎉","😅","🥹","😡","🥺","🤝","😂","🤣","😴"];
const QUICK_TEXTS = ["哈哈哈哈","？？？","妈呀","我去","靠","笑死","真的假的","嗯嗯","好耶","无语","（捶拳）","（盯）","（叹气）","诶","咋回事","不是吧"];

/* ================= 状态 ================= */
const LS_KEY="gr_api_key", LS_MODEL="gr_model", LS_MSGS="gr_msgs", LS_PERSONA="gr_persona";
const API_URL="https://ark.cn-beijing.volces.com/api/v3/chat/completions";
const MODELS=[
  {id:"doubao-seed-2-1-pro",label:"Doubao-Seed-2.1-pro"},
  {id:"doubao-seed-2-1-turbo",label:"Doubao-Seed-2.1-turbo"},
  {id:"doubao-seed-2-1-lite",label:"Doubao-Seed-2.1-lite"},
  {id:"doubao-seed-2-0-pro",label:"Doubao-Seed-2.0-pro"},
  {id:"doubao-seed-2-0-lite",label:"Doubao-Seed-2.0-lite"},
  {id:"doubao-seed-character",label:"Doubao-Seed-Character"},
  {id:"custom",label:"自定义模型"}
];
let state={
  key: localStorage.getItem(LS_KEY)||"",
  model: localStorage.getItem(LS_MODEL)||MODELS[0].id,
  persona: localStorage.getItem(LS_PERSONA)!=="0",
  msgs: []
};
try{ state.msgs=JSON.parse(localStorage.getItem(LS_MSGS)||"[]"); }catch(e){ state.msgs=[]; }

/* ================= DOM ================= */
const chatEl=document.getElementById("chat");
const inputEl=document.getElementById("input");
const sendBtn=document.getElementById("sendBtn");
const statusEl=document.getElementById("statusText");
const welcomeEl=document.getElementById("welcome");
const modelSelect=document.getElementById("modelSelect");
const customModelWrap=document.getElementById("customModelWrap");
const customModel=document.getElementById("customModel");
const keyInput=document.getElementById("keyInput");
const personaSwitch=document.getElementById("personaSwitch");
const personaIntro=document.getElementById("personaIntro");

/* ================= 初始化 ================= */
function initModels(){
  modelSelect.innerHTML="";
  MODELS.forEach(m=>{
    const opt=document.createElement("option");
    opt.value=m.id; opt.textContent=m.label;
    modelSelect.appendChild(opt);
  });
  const cur=MODELS.find(m=>m.id===state.model);
  if(!cur){
    modelSelect.value="custom";
    customModelWrap.style.display="block";
    customModel.value=state.model;
  }else{
    modelSelect.value=state.model;
  }
}
function renderEmojiPanel(){
  const p=document.getElementById("emojiPanel");
  p.innerHTML="";
  EMOJIS.forEach(e=>{
    const d=document.createElement("div");
    d.className="ep-item"; d.textContent=e; d.title="发送表情";
    d.onclick=()=>{ sendEmoji(e); };
    p.appendChild(d);
  });
  QUICK_TEXTS.forEach(t=>{
    const d=document.createElement("div");
    d.className="ep-item text"; d.textContent=t;
    d.onclick=()=>{ sendEmoji(t); };
    p.appendChild(d);
  });
}
function updateStatus(){
  if(state.key){
    statusEl.textContent="在线 · "+modelLabel();
  }else{
    statusEl.textContent="未配置 API Key · 点击右上角设置";
  }
}
function modelLabel(){
  const m=MODELS.find(x=>x.id===state.model);
  return m?m.label:state.model;
}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}
function renderWelcome(){
  welcomeEl.classList.toggle("show", state.msgs.length===0);
}
function renderMsgs(){
  chatEl.querySelectorAll(".msg,.time-tip").forEach(n=>n.remove());
  state.msgs.forEach(m=>appendMsgNode(m,false));
  renderWelcome();
  scrollBottom();
}
function appendMsgNode(m,isTemp){
  if(m.type==="time"){
    const t=document.createElement("div");t.className="time-tip";t.textContent=m.text;
    chatEl.appendChild(t);return t;
  }
  const wrap=document.createElement("div");
  wrap.className="msg "+(m.role==="user"?"me":"other");
  const av=document.createElement("div");
  av.className="mini-av";av.textContent=m.role==="user"?"我":"瑞";
  const bub=document.createElement("div");
  bub.className="bubble";
  bub.textContent=m.text;
  wrap.appendChild(av);wrap.appendChild(bub);
  chatEl.appendChild(wrap);
  if(!isTemp) scrollBottom();
  return bub;
}
function scrollBottom(){ chatEl.scrollTop=chatEl.scrollHeight; }

/* ================= 发送 ================= */
function sendEmoji(txt){
  closeEmoji();
  pushAndSend(txt);
}
function send(){
  const t=inputEl.value.trim();
  if(!t) return;
  inputEl.value="";
  autoGrow();
  pushAndSend(t);
}
function pushAndSend(txt){
  if(!state.key){
    toast("先在右上角「设置」里粘贴 API Key");
    openSettings();
    return;
  }
  state.msgs.push({role:"user",text:txt});
  saveMsgs();
  renderMsgs();
  setBusy(true);
  askAI();
}
async function askAI(){
  const history=state.msgs.map(m=>({role:m.role,content:m.text}));
  const sys={role:"system",content:state.persona?PERSONA_SYSTEM:"你是一个乐于助人的AI助手，回答保持简洁自然。"};
  const body={
    model:state.model,
    messages:[sys].concat(history.slice(-24)), // 保留最近24条作为记忆上下文
    stream:true
  };
  const bub=document.createElement("div");
  bub.className="bubble typing"; bub.textContent="";
  const wrap=document.createElement("div"); wrap.className="msg other";
  const av=document.createElement("div"); av.className="mini-av"; av.textContent="瑞";
  wrap.appendChild(av); wrap.appendChild(bub);
  chatEl.appendChild(wrap);
  let acc="",final="";
  try{
    const res=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+state.key},
      body:JSON.stringify(body)
    });
    if(!res.ok){
      let errTxt="请求失败 HTTP "+res.status;
      try{const j=await res.json();errTxt=j.error&&j.error.message?j.error.message:errTxt;}catch(e){}
      throw new Error(errTxt);
    }
    const reader=res.body.getReader();
    const dec=new TextDecoder("utf-8");
    let buf="";
    while(true){
      const {done,value}=await reader.read();
      if(done) break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split("\n\n");
      buf=parts.pop();
      for(const part of parts){
        const line=part.split("\n").find(l=>l.startsWith("data:"));
        if(!line) continue;
        const data=line.slice(5).trim();
        if(data==="[DONE]") continue;
        try{
          const j=JSON.parse(data);
          const delta=j.choices&&j.choices[0]&&j.choices[0].delta;
          if(delta&&delta.content){ acc+=delta.content; bub.textContent=acc; bub.classList.remove("typing"); scrollBottom(); }
        }catch(e){}
      }
    }
    final=acc.trim();
  }catch(err){
    bub.classList.remove("typing");
    bub.textContent="（对方不在线）"+err.message;
    final="";
    bub.style.color="#e64340";
  }
  if(final){
    state.msgs.push({role:"assistant",text:final});
    saveMsgs();
  }
  renderMsgs();
  setBusy(false);
  scrollBottom();
}
function setBusy(b){
  sendBtn.disabled=b;
  sendBtn.textContent=b?"…":"发送";
  inputEl.disabled=b;
}

/* ================= 记忆 ================= */
function saveMsgs(){
  // 只保留最近500条，防localStorage溢出
  if(state.msgs.length>500) state.msgs=state.msgs.slice(-500);
  localStorage.setItem(LS_MSGS,JSON.stringify(state.msgs));
}
function clearChat(){
  if(!confirm("确定清空全部聊天记录吗？")) return;
  state.msgs=[];
  saveMsgs();
  renderMsgs();
  toast("已清空");
  closeSettings();
}

/* ================= 设置 ================= */
function openSettings(){
  keyInput.value=state.key;
  modelSelect.value=MODELS.find(m=>m.id===state.model)?state.model:"custom";
  customModelWrap.style.display=modelSelect.value==="custom"?"block":"none";
  if(state.persona) personaSwitch.classList.add("on"); else personaSwitch.classList.remove("on");
  personaIntro.textContent=PERSONA_INTRO;
  document.getElementById("settings").classList.add("show");
}
function closeSettings(){ document.getElementById("settings").classList.remove("show"); }
function togglePersona(){ personaSwitch.classList.toggle("on"); }
function saveSettings(){
  state.key=keyInput.value.trim();
  const sel=modelSelect.value;
  state.model=sel==="custom"?(customModel.value.trim()||MODELS[0].id):sel;
  state.persona=personaSwitch.classList.contains("on");
  localStorage.setItem(LS_KEY,state.key);
  localStorage.setItem(LS_MODEL,state.model);
  localStorage.setItem(LS_PERSONA,state.persona?"1":"0");
  updateStatus();
  closeSettings();
  toast("已保存");
}
document.getElementById("settings").addEventListener("click",function(e){
  if(e.target===this) closeSettings();
});

/* ================= 表情面板 ================= */
function toggleEmoji(){
  const p=document.getElementById("emojiPanel");
  p.classList.toggle("show");
}
function closeEmoji(){ document.getElementById("emojiPanel").classList.remove("show"); }

/* ================= 输入框 ================= */
function autoGrow(){
  inputEl.style.height="auto";
  inputEl.style.height=Math.min(inputEl.scrollHeight,96)+"px";
}
inputEl.addEventListener("input",autoGrow);
inputEl.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); }
});
/* 点击聊天区关闭表情面板 */
chatEl.addEventListener("click",closeEmoji);

/* ================= toast ================= */
let toastTimer=null;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ================= 启动 ================= */
initModels();
renderEmojiPanel();
updateStatus();
renderMsgs();
</script>
